<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get the SPAR App</title>
<link rel="icon" type="image/png" href="assets/images/favicon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    padding: 24px;
  }

  #qrcode {
    line-height: 0;
  }

  #qrcode img,
  #qrcode canvas {
    display: block;
    width: min(90vw, 90vh, 560px) !important;
    height: min(90vw, 90vh, 560px) !important;
  }
</style>
</head>
<body>
  <div id="qrcode"></div>

  <script>
    // ▼▼▼ EDIT THIS to your actual redirect URL ▼▼▼
    const REDIRECT_URL = "https://xyz.com/redirect";

    new QRCode(document.getElementById("qrcode"), {
      text: REDIRECT_URL,
      width: 560,
      height: 560,
      colorDark: "#0A0E11",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  </script>
</body>
</html>
