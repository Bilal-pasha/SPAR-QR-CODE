<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening SPAR app…</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />

    <!-- ▼▼▼ EDIT: iOS Smart App Banner (Apple's own mechanism, shows a native-style banner) ▼▼▼ -->
    <meta name="apple-itunes-app" content="app-id=XXXXXXXXX" />

    <style>
      :root {
        --spar-red: #ea0a2a;
        --surface-body: #ffffff;
        --border-default: #edeef1;
        --text-secondary: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--surface-body);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border-default);
        border-top-color: var(--spar-red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #fallback {
        display: none;
      }

      .fallback-btn {
        color: var(--text-secondary);
        font-size: 13px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>

    <div id="fallback">
      <a class="fallback-btn" id="storeLink" href="#"
        >Tap here if you're not redirected</a
      >
    </div>

    <script>
      // ▼▼▼ EDIT THESE VALUES ▼▼▼
      // Custom URL schemes the app registers natively — confirmed in
      // ios/SPAR/Info.plist (CFBundleURLSchemes) and
      // android/app/src/main/AndroidManifest.xml (intent-filter data scheme).
      // Append a path if you want the app to land on a specific screen that
      // expo-router can resolve, e.g. "mobile://offers".
      const APP_SCHEME_URLS = ["mobile://", "com.techwards.spar://"];

      const IOS_APP_STORE_URL =
        "https://apps.apple.com/pk/app/spar-pk/id6804619003";

      // OPTIMIZED: Changed from market:// to intent:// to bypass browser blocking
      // and launch the Play Store app directly without needing user permissions.
      const ANDROID_PLAY_STORE_URL =
        "intent://details?id=com.techwards.spar#Intent;scheme=market;package=com.android.vending;end;";

      const DESKTOP_FALLBACK_URL = "https://www.spar.pk/";

      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /android/i.test(ua);

      // Determine the correct destination URL
      const storeUrl = isIOS
        ? IOS_APP_STORE_URL
        : isAndroid
          ? ANDROID_PLAY_STORE_URL
          : DESKTOP_FALLBACK_URL;

      // TRIGGER REDIRECTION: This line immediately redirects the browser window
      window.location.href = storeUrl;

      // NOTE: there's no Universal Links (iOS) / verified App Links (Android)
      // set up for this domain, so the OS never intercepts this URL on its
      // own — we have to actively try the app's custom scheme and detect
      // whether it took over. When it does, the tab backgrounds (visibility/
      // blur/pagehide fire) before our fallback timer runs, so we cancel the
      // store redirect. If nothing happens within the window, we assume the
      // app isn't installed and send the user to the right store.
      let appOpened = false;
      function markOpened() {
        appOpened = true;
      }
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) markOpened();
      });
      window.addEventListener("pagehide", markOpened);
      window.addEventListener("blur", markOpened);

      function goToStore() {
        if (!appOpened) window.location.replace(storeUrl);
      }

      // Try each registered scheme a beat apart — only one will actually be
      // claimed by the app, the rest are silently ignored by the OS. iOS
      // Safari pops a "cannot open page" alert when window.location is set
      // directly to an unclaimed custom scheme, so attempt it through a
      // throwaway iframe instead — that fails silently.
      function attemptScheme(scheme) {
        if (isIOS) {
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = scheme;
          document.body.appendChild(iframe);
          setTimeout(function () {
            document.body.removeChild(iframe);
          }, 1000);
        } else {
          window.location.href = scheme;
        }
      }

      function tryAppSchemes() {
        APP_SCHEME_URLS.forEach(function (scheme, i) {
          setTimeout(function () {
            if (!appOpened) attemptScheme(scheme);
          }, i * 250);
        });
      }

      if (isMobile) {
        tryAppSchemes();
        setTimeout(goToStore, 1500);
      } else {
        setTimeout(goToStore, 800);
      }

      // A direct tap carries a user gesture, which some browsers require
      // before they'll let a page hand off to another app — so give the
      // schemes one more try on click rather than only falling straight
      // through to the store link.
      storeLinkEl.addEventListener("click", function (e) {
        if (!isMobile) return;
        e.preventDefault();
        appOpened = false;
        tryAppSchemes();
        setTimeout(goToStore, 900);
      });
    </script>
  </body>
</html>
