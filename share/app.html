<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opening SPAR app…</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />

    <!-- ▼▼▼ EDIT: iOS Smart App Banner (Apple's own mechanism, shows a native-style banner) ▼▼▼ -->
    <meta name="apple-itunes-app" content="app-id=XXXXXXXXX" />

    <style>
      :root {
        --spar-red: #ea0a2a;
        --surface-body: #ffffff;
        --border-default: #edeef1;
        --text-secondary: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: var(--surface-body);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid var(--border-default);
        border-top-color: var(--spar-red);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #fallback {
        display: none;
      }

      .fallback-btn {
        color: var(--text-secondary);
        font-size: 13px;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>

    <div id="fallback">
      <a class="fallback-btn" id="storeLink" href="#"
        >Tap here if you're not redirected</a
      >
    </div>

    <script>
      // ▼▼▼ EDIT THESE VALUES ▼▼▼
      // Custom scheme the app registers natively (app.config.js `scheme`,
      // confirmed in ios/SPAR/Info.plist CFBundleURLSchemes and
      // android/app/src/main/AndroidManifest.xml intent-filter data scheme).
      const APP_SCHEME = "mobile";
      const IOS_APP_SCHEME_URLS = ["mobile://", "com.techwards.spar://"];
      const ANDROID_PACKAGE = "com.techwards.spar";

      const IOS_APP_STORE_URL =
        "https://apps.apple.com/pk/app/spar-pk/id6804619003";
      const ANDROID_PLAY_STORE_URL =
        "https://play.google.com/store/apps/details?id=com.techwards.spar&hl=en";
      const DESKTOP_FALLBACK_URL = "https://www.spar.pk/";

      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isIOS = /iPad|iPhone|iPod/.test(ua) && !window.MSStream;
      const isAndroid = /android/i.test(ua);
      const isMobile = isIOS || isAndroid;

      const storeUrl = isIOS
        ? IOS_APP_STORE_URL
        : isAndroid
          ? ANDROID_PLAY_STORE_URL
          : DESKTOP_FALLBACK_URL;

      const storeLinkEl = document.getElementById("storeLink");
      storeLinkEl.href = storeUrl;
      document.getElementById("fallback").style.display = "block";

      if (isAndroid) {
        // Chrome's intent:// syntax opens the app directly by package if it's
        // installed, and falls back to S.browser_fallback_url on its own if
        // not — one navigation, no polling/guessing, and (unlike a raw
        // custom-scheme URL) it never replaces the page with an error screen
        // when the app is missing, so the fallback is guaranteed to fire.
        const intentUrl =
          "intent://#Intent;scheme=" +
          APP_SCHEME +
          ";package=" +
          ANDROID_PACKAGE +
          ";S.browser_fallback_url=" +
          encodeURIComponent(ANDROID_PLAY_STORE_URL) +
          ";end";
        window.location.replace(intentUrl);
      } else if (isIOS) {
        // NOTE: there's no Universal Links set up for this domain, so iOS
        // never intercepts this URL on its own — we have to actively try the
        // app's custom scheme and detect whether it took over. When it does,
        // the tab backgrounds (visibility/blur/pagehide fire) before our
        // fallback timer runs, so we cancel the store redirect. If nothing
        // happens within the window, we assume the app isn't installed and
        // send the user to the App Store.
        let appOpened = false;
        function markOpened() {
          appOpened = true;
        }
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) markOpened();
        });
        window.addEventListener("pagehide", markOpened);
        window.addEventListener("blur", markOpened);

        function goToStore() {
          if (!appOpened) window.location.replace(storeUrl);
        }

        // Try each registered scheme a beat apart — only one will actually be
        // claimed by the app, the rest are silently ignored by the OS. Safari
        // pops a "cannot open page" alert when window.location is set
        // directly to an unclaimed custom scheme, so attempt it through a
        // throwaway iframe instead — that fails silently.
        function attemptScheme(scheme) {
          var iframe = document.createElement("iframe");
          iframe.style.display = "none";
          iframe.src = scheme;
          document.body.appendChild(iframe);
          setTimeout(function () {
            document.body.removeChild(iframe);
          }, 1000);
        }

        function tryAppSchemes() {
          IOS_APP_SCHEME_URLS.forEach(function (scheme, i) {
            setTimeout(function () {
              if (!appOpened) attemptScheme(scheme);
            }, i * 250);
          });
        }

        tryAppSchemes();
        setTimeout(goToStore, 1500);

        // A direct tap carries a user gesture, which some browsers require
        // before they'll let a page hand off to another app — so give the
        // schemes one more try on click rather than only falling straight
        // through to the store link.
        storeLinkEl.addEventListener("click", function (e) {
          e.preventDefault();
          appOpened = false;
          tryAppSchemes();
          setTimeout(goToStore, 900);
        });
      } else {
        setTimeout(function () {
          window.location.replace(storeUrl);
        }, 800);
      }
    </script>
  </body>
</html>
